# "Arvore de Beneficios do VIP" - so faz sentido em servidores com pegada de RPG/
# progression. ATIVADA (enabled: true).
#
# IMPORTANTE: os "effect" abaixo sao so REGISTRADOS (pontos gastos, perk marcado
# como desbloqueado) - a aplicacao real do efeito no jogo (ex: SELL_MULTIPLIER
# afetando o AlkaShop de verdade) NAO esta implementada nesta versao, ver
# AlkaVipsBoostAPI/memoria do projeto pra o mesmo tipo de limitacao no Boost de
# Servidor. AUTO_UPGRADE_ROD e AUTO_SELL_BAG_FULL SAO reais (AlkaFish consulta
# hasPerk() direto, nao depende desse "effect" ser aplicado aqui).
enabled: true

points-per-tier:
  vip: 30
  vip+: 60
  mvp: 100
  mvp+: 150
  alka: 250
  drakkar: 400

branches:
  economico:
    name: "<gold>Econômico"
    perks:
      sell-boost-5:
        name: "+5% Venda"
        cost: 20
        effect: {type: SELL_MULTIPLIER, value: 1.05}
      sell-boost-10:
        name: "+10% Venda"
        cost: 40
        requires: sell-boost-5
        effect: {type: SELL_MULTIPLIER, value: 1.10}

  mineracao:
    name: "<gray>Mineração"
    perks:
      extra-mine-slot:
        name: "+1 Mina Particular"
        cost: 30
        effect: {type: EXTRA_MINE_SLOT, value: 1}

  pesca:
    name: "<aqua>Pesca"
    perks:
      auto-upgrade-rod:
        name: "Auto-Upgrade de Vara"
        cost: 40
        effect: {type: AUTO_UPGRADE_ROD, value: 1}
      auto-sell-bag-full:
        name: "Auto-Venda ao Encher a Sacola"
        cost: 40
        effect: {type: AUTO_SELL_BAG_FULL, value: 1}

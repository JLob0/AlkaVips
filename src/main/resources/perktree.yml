# "Arvore de Beneficios do VIP" - so faz sentido em servidores com pegada de RPG/
# progression. ATIVADA (enabled: true).
#
# SELL_MULTIPLIER: real - AlkaShop consome via AlkaVipsAPI#getPerkSellMultiplier
# (SellManager, combinado multiplicativamente com o boost de servidor e o multiplicador
# do AlkaRankUp). AUTO_UPGRADE_ROD e AUTO_SELL_BAG_FULL: reais (AlkaFish consulta
# hasPerk() direto). EXTRA_MINE_SLOT: so REGISTRADO ainda - AlkaVipsAPI#getExtraMineSlots
# existe e devolve o valor certo, mas o AlkaMines nao tem hoje um conceito de "limite de
# minas particulares por jogador" pra consumir isso (nao existe enforcement de contagem
# de mina particular no codigo atual) - precisa desenhar essa feature no AlkaMines antes
# de conseguir aplicar esse perk de verdade.
enabled: true

points-per-tier:
  vip: 30
  vip+: 60
  mvp: 100
  mvp+: 150
  alka: 250
  drakkar: 400

branches:
  economico:
    name: "<gold>Econômico"
    perks:
      sell-boost-5:
        name: "+5% Venda"
        cost: 20
        effect: {type: SELL_MULTIPLIER, value: 1.05}
      sell-boost-10:
        name: "+10% Venda"
        cost: 40
        requires: sell-boost-5
        effect: {type: SELL_MULTIPLIER, value: 1.10}

  mineracao:
    name: "<gray>Mineração"
    perks:
      extra-mine-slot:
        name: "+1 Mina Particular"
        cost: 30
        effect: {type: EXTRA_MINE_SLOT, value: 1}

  pesca:
    name: "<aqua>Pesca"
    perks:
      auto-upgrade-rod:
        name: "Auto-Upgrade de Vara"
        cost: 40
        effect: {type: AUTO_UPGRADE_ROD, value: 1}
      auto-sell-bag-full:
        name: "Auto-Venda ao Encher a Sacola"
        cost: 40
        effect: {type: AUTO_SELL_BAG_FULL, value: 1}

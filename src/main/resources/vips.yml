# Definicao de todos os VIPs do servidor. Suporta tags MiniMessage nas mensagens/lore.
# time-type: ONLINE (so desconta online) | SERVER (desconta com o servidor ligado) | REALTIME (desconta sempre)
# order: usado por VipTypeManager#getOrderedVips() (menor -> maior). tag-permanent: se true,
# o jogador mantem uma "tag de veterano" mesmo apos o VIP expirar (so faz sentido no topo da cadeia).

vips:
  vip:
    display: '<#55FF55>[VIP]'
    prefix: '<#55FF55><b>VIP</b>'
    time-type: 'ONLINE'
    credit: 10.0
    party-vip-value: 10.0
    activation-menu: false
    allow-sell: true
    order: 1
    tag-permanent: false
    icon:
      material: EMERALD
      name: '<#55FF55>VIP'
      lore: []
    key-preview:
      material: TRIPWIRE_HOOK
      name: '<#55FF55>★ [VIP] <dark_gray><id>'
      lore:
        - '<gray>─────────────────'
        - '<gray>Tier: <#55FF55>[VIP]'
        - '<gray>Duracao: <white><expire_remaining>'
        - '<gray>Codigo: <dark_gray><id>'
        - ''
        - '<green><bold>⬅ ESQUERDO <gray>para ativar'
        - '<red><bold>➡ DIREITO <gray>para vender'
        - '<gray>─────────────────'
    active-preview:
      material: EMERALD
      name: '<#55FF55>[VIP] <dark_gray><id>'
      lore:
        - ' <white>Ativado por: <green><player>'
        - ' <white>Status: <green>Ativo'
        - ' <gray>Expira em: <white><expire_remaining>'
    expired-preview:
      material: EMERALD
      name: '<#55FF55>[VIP] <dark_gray><id>'
      lore:
        - ' <white>Status: <red>EXPIRADO'
    announces:
      sound: ''
      effect: ''
      actionbar: '<gray><player><aqua> acaba de ativar o <#55FF55>VIP'
      title: '<gray><player><aqua> ativou<newline><#55FF55>VIP'
      chat: |
        <green><b>VIPS</b>
        <aqua>O jogador <gray><player> <aqua>acaba de
        <aqua>se tornar <gray>(<#55FF55>VIP<gray>)<aqua>.
      chat-private: |
        <green><b>VIPS</b>
        <gray>Recolha sua ativacao no /vip
    group-command:
      add: ['lp user {player} parent add vip']
      remove: ['lp user {player} parent remove vip']
      addtime: ['lp user {player} parent addtemp vip {time} accumulate']
      removetime: ['lp user {player} parent removetemp vip {time}']
    activation-commands:
      - '100.0,give {player} emerald 16'
    activation-items:
      item-1:
        chance: 100.0
        material: EMERALD
        name: '<#55FF55>Cristal VIP'
        amount: 1
    upgrade:
      vip-type: 'vip+'
      message: |
        <aqua><b>UPGRADE</b>
        <green>Voce upou do <#55FF55>[VIP] <green>para o <#55FF55><b>VIP+</b>
      message-broadcast: ''
      prices:
        coins: 5000.0
    discord:
      webhook-enabled: true
      embed-id: 'activated'
    perks:
      fly: false
      autopickup: false
      autosmelt: false
      keep-inventory: false
      back: false
      feed: true
      reparar: false
      bigorna: true
      bancada: true
      colored-signs: false


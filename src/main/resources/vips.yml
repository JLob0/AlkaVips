# Definicao de todos os VIPs do servidor. Suporta tags MiniMessage nas mensagens/lore.
# time-type: ONLINE (so desconta online) | SERVER (desconta com o servidor ligado) | REALTIME (desconta sempre)
# order: usado por VipTypeManager#getOrderedVips() (menor -> maior). tag-permanent: se true,
# o jogador mantem uma "tag de veterano" mesmo apos o VIP expirar (so faz sentido no topo da cadeia).

vips:
  vip:
    display: '<#55FF55>[VIP]'
    prefix: '<#55FF55><b>VIP</b>'
    time-type: 'ONLINE'
    credit: 10.0
    party-vip-value: 10.0
    activation-menu: false
    allow-sell: true
    order: 1
    tag-permanent: false
    permission-group: vip
    icon:
      material: EMERALD
      name: '<#55FF55>VIP'
      lore: []
    key-preview:
      material: TRIPWIRE_HOOK
      name: '<#55FF55>★ [VIP] <dark_gray><id>'
      lore:
        - '<gray>─────────────────'
        - '<gray>Tier: <#55FF55>[VIP]'
        - '<gray>Duracao: <white><expire_remaining>'
        - '<gray>Codigo: <dark_gray><id>'
        - ''
        - '<#55FF55>ᴘᴇʀᴍɪssões'
        - '%permissions%'
        - ''
        - '<green><bold>⬅ ESQUERDO <gray>para ativar'
        - '<red><bold>➡ DIREITO <gray>para vender'
        - '<gray>─────────────────'
    active-preview:
      material: EMERALD
      name: '<#55FF55>[VIP] <dark_gray><id>'
      lore:
        - ' <white>Ativado por: <green><player>'
        - ' <white>Status: <green>Ativo'
        - ' <gray>Expira em: <white><expire_remaining>'
    expired-preview:
      material: EMERALD
      name: '<#55FF55>[VIP] <dark_gray><id>'
      lore:
        - ' <white>Status: <red>EXPIRADO'
    announces:
      sound: 'ENTITY_PLAYER_LEVELUP'
      effect: 'HAPPY_VILLAGER'
      actionbar: '<#55FF55>✦ <white>ATIVAÇÃO DE VIP <#55FF55>✦  <gray><player> <dark_gray>→ <gradient:#55FF55:#00FF00><bold>VIP</bold></gradient>'
      title: '<gradient:#00AAFF:#FFFFFF><player></gradient><newline><gray>se tornou <gradient:#55FF55:#00FF00><bold>[VIP]</bold></gradient>'
      chat: |
        <dark_gray><st>――――――――――――――――――――――――――――――</st>
        <gradient:#55FF55:#00FF00><bold>✦ NOVO VIP ✦</bold></gradient>

        <gradient:#00AAFF:#FFFFFF><player></gradient> <gray>acaba de se tornar <gradient:#55FF55:#00FF00><bold>[VIP]</bold></gradient><gray>!

        <gray>Garanta o seu também em
        <#FFD700>➤ <click:open_url:'<shop-url>'><hover:show_text:'<#55FF55>Clique para abrir a loja!'><shop-url></hover></click>
        <dark_gray><st>――――――――――――――――――――――――――――――</st>
      chat-private: |
        <gradient:#55FF55:#00FF00><bold>✦ PARABÉNS!</bold></gradient>
        <white>Você ativou o <gradient:#55FF55:#00FF00><bold>[VIP]</bold></gradient><white>!
        <gray>Use <click:suggest_command:'/vip'><hover:show_text:'<#55FF55>Clique para abrir o menu VIP'><#55FF55>/vip</hover></click> <gray>para gerenciar seus benefícios.
    group-command:
      add: ['lp user {player} parent add vip']
      remove: ['lp user {player} parent remove vip']
      addtime: ['lp user {player} parent addtemp vip {time} accumulate']
      removetime: ['lp user {player} parent removetemp vip {time}']
    activation-commands:
      - '100.0,give {player} emerald 16'
    activation-items:
      item-1:
        chance: 100.0
        material: EMERALD
        name: '<#55FF55>Cristal VIP'
        amount: 1
    # Presente unico por conta (nunca se repete, nem se o jogador comprar VIP de novo
    # mais pra frente) - so libera se ESTA compra valer 30+ dias, pra ninguem farmar
    # comprando o VIP de 1h repetidas vezes. Ver ActivationService#deliverActivationBonus.
    activation-bonus:
      min-duration-days: 30
      items:
        item-1:
          chance: 100.0
          material: EMERALD_BLOCK
          name: '<#55FF55><bold>Baú de Boas-Vindas [VIP]</bold>'
          lore:
            - '<gray>Presente unico por ativar 30+ dias'
            - '<gray>de <#55FF55>[VIP]<gray> pela primeira vez.'
          amount: 8
        item-2:
          chance: 30.0
          material: DIAMOND
          name: '<aqua>Diamante Bônus'
          amount: 1
      sound: 'ENTITY_PLAYER_LEVELUP'
      effect: 'HAPPY_VILLAGER'
      actionbar: '<#55FF55>✦ <white>BÔNUS DE ATIVAÇÃO <#55FF55>✦  <gray><player> <dark_gray>→ <gradient:#55FF55:#00FF00><bold>[VIP] 30+ dias</bold></gradient>'
      title: '<gradient:#00AAFF:#FFFFFF><player></gradient><newline><gray>desbloqueou o <gradient:#55FF55:#00FF00><bold>Bônus de Ativação</bold></gradient>'
      chat: |
        <dark_gray><st>――――――――――――――――――――――――――――――</st>
        <gradient:#55FF55:#00FF00><bold>✦ BÔNUS DE ATIVAÇÃO ✦</bold></gradient>

        <gradient:#00AAFF:#FFFFFF><player></gradient> <gray>ativou <#55FF55>30+ dias <gray>de <gradient:#55FF55:#00FF00><bold>[VIP]</bold></gradient> <gray>e recebeu um presente único!
        <dark_gray><st>――――――――――――――――――――――――――――――</st>
    upgrade:
      vip-type: 'vip+'
      message: |
        <aqua><b>UPGRADE</b>
        <green>Voce upou do <#55FF55>[VIP] <green>para o <#55FF55><b>VIP+</b>
      message-broadcast: ''
      prices:
        coins: 5000.0
    discord:
      webhook-enabled: true
      embed-id: 'activated'
    perks:
      fly: false
      autopickup: false
      autosmelt: false
      keep-inventory: false
      back: false
      feed: true
      reparar: false
      bigorna: true
      bancada: true
      colored-signs: false
    # Exemplo de acoes executaveis em eventos (formato "[tipo] conteudo", ver
    # EventActionExecutor.java pros tipos suportados). Opcional - se a secao
    # inteira for omitida, nenhuma acao extra roda no evento.
    events:
      on-activate:
        - '[sound] ENTITY_PLAYER_LEVELUP'
        - '[actionbar] <#55FF55>✦ Bem-vindo ao [VIP]!'
      on-expire:
        - '[console] tell {player} Seu VIP expirou. Renove pelo /vip!'
      on-enable: []
      on-disable: []


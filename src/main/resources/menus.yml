# Titulos, tamanhos, icones e lores das GUIs do AlkaVips. Posicao dos slots fica em
# gui-layouts.yml (mesma letra usada la referencia a chave <menu>.<papel> aqui).
# Placeholders entre {} sao trocados na hora (ver ConfigManager#menuItem).

# Icones repetidos em quase toda GUI - referenciados via "common.<nome>" direto no
# Java, em vez de duplicar o mesmo material/nome em cada um dos 15 menus.
common:
  voltar:
    material: ARROW
    name: "<red>Voltar"
  anterior:
    material: ARROW
    name: "<white>Anterior"
  proximo:
    material: ARROW
    name: "<white>Proximo"

main:
  title: "<dark_gray>VIPs <dark_gray>» <light_purple>Principal"
  size: 36
  history:
    material: WRITTEN_BOOK
    name: "<#AA55FF><bold>📜 Historico de VIPs"
    lore:
      - "<gray>Visualize todo o historico de"
      - "<gray>ativacoes, upgrades e expiracoes."
      - ""
      - "<#AA55FF>Clique para abrir"
  pending:
    material: REDSTONE_TORCH
    name: "<#FFAA00><bold>🔥 Ativacoes Pendentes"
    lore:
      - "<gray>VIPs comprados aguardando"
      - "<gray>ativacao manual. Colete-os aqui!"
      - ""
      - "<#FFAA00>Clique para abrir"
  kits:
    material: CHEST
    name: "<#55FF55><bold>🎁 Kits de Ativacao"
    lore:
      - "<gray>Pegue os kits de ativacao"
      - "<gray>desbloqueados pelos seus VIPs"
      - "<gray>de 30+ dias."
      - ""
      - "<gray>Kits diarios/semanais/mensais"
      - "<gray>recorrentes ficam em <yellow>/kits<gray>."
      - ""
      - "<#55FF55>Clique para abrir"
  upgrade:
    material: ENDER_CHEST
    name: "<#FF55FF><bold>⬆ Upar VIP"
    lore-has-upgrade:
      - "<gray>Evolua seu VIP atual para o"
      - "<gray>proximo tier com preco proporcional!"
      - ""
      - "<#FF55FF>Proximo tier: <white>{proximo}"
      - ""
      - "<#FF55FF>Clique para upar"
    lore-maxed:
      - "<gray>Evolua seu VIP atual para o"
      - "<gray>proximo tier com preco proporcional!"
      - ""
      - "<gray>Seu VIP ja esta no tier maximo."
    lore-none:
      - "<gray>Evolua seu VIP atual para o"
      - "<gray>proximo tier com preco proporcional!"
      - ""
      - "<gray>Voce precisa de um VIP ativo"
      - "<gray>selecionado para upar."
  party:
    material: COMPASS
    name: "<#FFD700><bold>🎉 Party VIP"
    lore:
      - "<gray>Contribua com Prisma para"
      - "<gray>desbloquear recompensas em grupo!"
      - ""
      - "<#FFD700>Progresso: <white>{percentual}%"
      - "<gray>{progresso}/{meta} Prisma"
      - ""
      - "<#FFD700>Clique para visualizar"
  keys:
    material: TRIPWIRE_HOOK
    name: "<#55AAFF><bold>🔑 Minhas Keys"
    lore:
      - "<gray>Suas chaves de VIP guardadas."
      - "<gray>Ative ou venda conforme desejar."
      - ""
      - "<#55AAFF>Clique para abrir"
  wallet:
    material: BOOK
    name: "<#FFD700><bold>💰 Carteira VIP"
    lore:
      - "<gray>Veja seu historico, gastos"
      - "<gray>e conquistas de VIP."
      - ""
      - "<#FFD700>Clique para abrir"
  p2p-market:
    material: EMERALD_BLOCK
    name: "<#00AAFF><bold>🛒 Mercado de VIPs"
    lore:
      - "<gray>Compre e venda assinaturas"
      - "<gray>de VIP ativas com outros jogadores."
      - ""
      - "<#00AAFF>Clique para abrir"
  shop:
    material: EMERALD
    name: "<#00FFAA><bold>✦ Loja Prisma"
    lore:
      - "<gray>Troque seu Prisma por"
      - "<gray>itens raros e valiosos!"
      - ""
      - "<#00FFAA>Clique para abrir"
  switch-vip:
    material: COMPASS
    name: "<#FFAA00><bold>🔄 Trocar VIP"
    lore:
      - "<gray>Alterne entre seus VIPs ativos"
      - "<gray>para mudar prefixo e perks ativos."
      - ""
      - "<#FFAA00>Clique para trocar"
  marketplace:
    material: CHEST
    name: "<#FF5555><bold>🏪 Loja de Chaves"
    lore:
      - "<gray>Compre chaves de VIP de outros"
      - "<gray>jogadores no marketplace!"
      - ""
      - "<#FF5555>Clique para abrir"
  top:
    material: GOLD_BLOCK
    name: "<#FFD700><bold>🏆 TOP VIP"
    lore:
      - "<gray>Os jogadores mais dedicados da"
      - "<gray>rede Alka. Suba no ranking!"
      - ""
      - "<#FFD700>Clique para visualizar"
  perk-tree:
    material: ENCHANTED_BOOK
    name: "<#AA55FF><bold>🌳 Arvore de Beneficios"
    lore:
      - "<gray>Gaste pontos de perk ganhos"
      - "<gray>ativando VIP em beneficios extras."
      - ""
      - "<#AA55FF>Clique para abrir"

